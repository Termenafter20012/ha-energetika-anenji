# Energy accounting for a 25.6 V, 100 Ah battery: 2560 Wh nominal.
# Positive battery_power means charging. Solar automation below is opt-in.
# Remaining energy is restored by Home Assistant and changes only by W * h.
input_button:
  energetika_battery_full:
    name: "Энергетика · АКБ полностью заряжена"
    icon: mdi:battery-check

# Separate local component; addresses and cookies are never stored in this file.
energetika_dtek: {}

template:
  - sensor:
      - name: Energetika Outage Energy Required
        unique_id: energetika_outage_energy_required
        default_entity_id: sensor.energetika_outage_energy_required
        unit_of_measurement: Wh
        device_class: energy
        availability: >-
          {{ is_state('binary_sensor.energetika_grid_present', 'off')
             and state_attr('sensor.energetika_dtek_status', 'fresh') == true
             and state_attr('sensor.energetika_dtek_status', 'restoration_at') | float(0) > as_timestamp(now())
             and has_value('sensor.anenji_4200_protocol_1_battery_power')
             and as_timestamp(now()) - as_timestamp(states.sensor.anenji_4200_protocol_1_battery_power.last_reported, 0) < 120 }}
        state: >-
          {% set hours = (state_attr('sensor.energetika_dtek_status', 'restoration_at') | float(0) - as_timestamp(now())) / 3600 %}
          {% set discharge = [0, -(states('sensor.anenji_4200_protocol_1_battery_power') | float(0))] | max %}
          {{ ([0, hours] | max * discharge) | round(0) }}
        attributes:
          model: Current net battery power held constant; no future solar or load changes assumed
          reserve_wh: 512
      - name: Energetika Outage Energy Margin
        unique_id: energetika_outage_energy_margin
        default_entity_id: sensor.energetika_outage_energy_margin
        unit_of_measurement: Wh
        device_class: energy
        availability: "{{ has_value('sensor.energetika_outage_energy_required') and has_value('sensor.energetika_battery_remaining') }}"
        state: "{{ (states('sensor.energetika_battery_remaining') | float(0) - 512 - states('sensor.energetika_outage_energy_required') | float(0)) | round(0) }}"
  - binary_sensor:
      - name: Energetika Grid Present
        unique_id: energetika_grid_present
        default_entity_id: binary_sensor.energetika_grid_present
        device_class: power
        availability: >-
          {{ has_value('sensor.anenji_4200_protocol_1_grid_voltage')
             and 0 <= states('sensor.anenji_4200_protocol_1_grid_voltage') | float(-1) <= 300
             and as_timestamp(now()) - as_timestamp(states.sensor.anenji_4200_protocol_1_grid_voltage.last_reported, 0) < 120 }}
        state: >-
          {% set v = states('sensor.anenji_4200_protocol_1_grid_voltage') | float(-1) %}
          {{ v >= 90 or (v > 50 and this.state == 'on') }}
        delay_on: "00:00:05"
        delay_off: "00:00:05"
    sensor:
      - name: Energetika Notification Devices
        unique_id: energetika_notification_devices
        default_entity_id: sensor.energetika_notification_devices
        state: "{{ integration_entities('mobile_app') | select('match', '^notify[.]') | list | count }}"
        attributes:
          devices: >-
            {% set ns = namespace(rows=[]) %}
            {% for e in integration_entities('mobile_app') if e.startswith('notify.') %}
              {% set ns.rows = ns.rows + [dict(entity=e, name=state_attr(e, 'friendly_name') or e)] %}
            {% endfor %}
            {{ ns.rows }}
  # Persistent SMG alarm episodes. Missing data never resolves an alarm.
  # Keep up to 100 episodes, prioritising all open ones (at most 64 mask bits).
  # Compact timestamps keep attributes below Recorder's 16 KiB limit.
  - triggers:
      - trigger: state
        entity_id:
          - sensor.anenji_4200_protocol_1_fault_code
          - sensor.anenji_4200_protocol_1_warning_code
        id: masks
      - trigger: time_pattern
        seconds: "/30"
        id: freshness
      - trigger: homeassistant
        event: start
        id: startup
      - trigger: event
        event_type: energetika_alarm_journal
        id: journal
    variables:
      alarm_now: "{{ as_timestamp(now()) | int }}"
      alarm_event_id: "{{ (as_timestamp(now()) * 1000000) | int }}"
      alarm_fault: "{{ states('sensor.anenji_4200_protocol_1_fault_code') | int(-1) }}"
      alarm_warning: "{{ states('sensor.anenji_4200_protocol_1_warning_code') | int(-1) }}"
      alarm_fresh_f: >-
        {{ 0 <= alarm_fault <= 4294967295
           and as_timestamp(now()) - as_timestamp(states.sensor.anenji_4200_protocol_1_fault_code.last_reported, 0) < 120 }}
      alarm_fresh_w: >-
        {{ 0 <= alarm_warning <= 4294967295
           and as_timestamp(now()) - as_timestamp(states.sensor.anenji_4200_protocol_1_warning_code.last_reported, 0) < 120 }}
      alarm_operation: "{{ trigger.event.data.get('operation', '') if trigger.id == 'journal' else '' }}"
      alarm_entry_id: "{{ trigger.event.data.get('entry_id', '') if trigger.id == 'journal' else '' }}"
    sensor:
      - name: Energetika Inverter Alerts
        unique_id: energetika_inverter_alerts
        default_entity_id: sensor.energetika_inverter_alerts
        icon: mdi:alert-outline
        state: >-
          {% set ns = namespace(count=0) %}
          {% for mask in [alarm_fault, alarm_warning] if mask >= 0 %}
            {% for bit in range(32) %}
              {% if mask | bitwise_and(2 ** bit) %}{% set ns.count = ns.count + 1 %}{% endif %}
            {% endfor %}
          {% endfor %}
          {{ ns.count }}
        attributes:
          monitoring_since: "{{ this.attributes.get('monitoring_since', alarm_now) }}"
          checked_at: "{{ alarm_now }}"
          fault_fresh: "{{ alarm_fresh_f }}"
          warning_fresh: "{{ alarm_fresh_w }}"
          fault_mask: "{{ alarm_fault }}"
          warning_mask: "{{ alarm_warning }}"
          entries: >-
            {% set ns = namespace(rows=[], open_keys=[]) %}
            {% for old in this.attributes.get('entries', []) %}
              {% set mask = alarm_fault if old.kind == 'fault' else alarm_warning %}
              {% set fresh = alarm_fresh_f if old.kind == 'fault' else alarm_fresh_w %}
              {% set ended = old.ended %}
              {% if not ended and fresh and not (mask | bitwise_and(2 ** old.bit)) %}
                {% set ended = alarm_now %}
              {% endif %}
              {% set acknowledged = old.acknowledged %}
              {% set deleted = old.deleted %}
              {% if old.id == alarm_entry_id %}
                {% if alarm_operation == 'ack' %}{% set acknowledged = alarm_now %}{% endif %}
                {% if alarm_operation == 'hide' and ended %}{% set deleted = alarm_now %}{% endif %}
                {% if alarm_operation == 'restore' %}{% set deleted = 0 %}{% endif %}
              {% endif %}
              {% set ns.rows = ns.rows + [dict(old, ended=ended, acknowledged=acknowledged, deleted=deleted)] %}
              {% if not ended %}{% set ns.open_keys = ns.open_keys + [old.kind ~ ':' ~ old.bit] %}{% endif %}
            {% endfor %}
            {% for kind, mask, fresh in [('fault', alarm_fault, alarm_fresh_f), ('warning', alarm_warning, alarm_fresh_w)] %}
              {% if fresh %}
                {% for bit in range(32) %}
                  {% if mask | bitwise_and(2 ** bit) and (kind ~ ':' ~ bit) not in ns.open_keys %}
                    {% set ns.rows = ns.rows + [dict(id=kind[0] ~ bit ~ ':' ~ alarm_event_id, kind=kind, bit=bit,
                       started=alarm_now, ended=0, acknowledged=0, deleted=0)] %}
                  {% endif %}
                {% endfor %}
              {% endif %}
            {% endfor %}
            {% set completed = ns.rows | rejectattr('ended', 'eq', 0) | list %}
            {% set active = ns.rows | selectattr('ended', 'eq', 0) | list %}
            {% set slots = 100 - (active | count) %}
            {{ (completed[-slots:] if slots > 0 else []) + active }}

  - binary_sensor:
      - name: Energetika Battery Absorption Seen
        unique_id: energetika_battery_absorption_seen
        default_entity_id: binary_sensor.energetika_battery_absorption_seen
        state: >-
          {{ is_state('binary_sensor.anenji_4200_protocol_1_battery_connected', 'on')
             and has_value('sensor.anenji_4200_protocol_1_battery_voltage')
             and has_value('sensor.anenji_4200_protocol_1_battery_bulk_voltage')
             and not is_state('binary_sensor.anenji_4200_protocol_1_battery_protection_active', 'on')
             and as_timestamp(now()) - as_timestamp(states.sensor.anenji_4200_protocol_1_battery_voltage.last_reported, 0) < 120
             and states('sensor.anenji_4200_protocol_1_battery_voltage') | float(0)
                 >= states('sensor.anenji_4200_protocol_1_battery_bulk_voltage') | float(99) - 0.2
             and states('sensor.anenji_4200_protocol_1_battery_voltage') | float(99)
                 <= states('sensor.anenji_4200_protocol_1_battery_bulk_voltage') | float(0) + 0.3 }}
        delay_on:
          minutes: 1
      - name: Energetika Battery Discharge Sustained
        unique_id: energetika_battery_discharge_sustained
        default_entity_id: binary_sensor.energetika_battery_discharge_sustained
        # The full-charge tail permits +/-60 W. A -39 W idle reading must not
        # cancel that same tail before its five-minute qualification completes.
        state: >-
          {{ has_value('sensor.anenji_4200_protocol_1_battery_power')
             and as_timestamp(now()) - as_timestamp(states.sensor.anenji_4200_protocol_1_battery_power.last_reported, 0) < 120
             and states('sensor.anenji_4200_protocol_1_battery_power') | float(0) < -60 }}
        delay_on:
          minutes: 1
      - name: Energetika Battery Full Qualified
        unique_id: energetika_battery_full_qualified
        default_entity_id: binary_sensor.energetika_battery_full_qualified
        availability: >-
          {{ has_value('sensor.anenji_4200_protocol_1_battery_voltage')
             and has_value('sensor.anenji_4200_protocol_1_battery_bulk_voltage')
             and has_value('sensor.anenji_4200_protocol_1_battery_float_voltage')
             and has_value('sensor.anenji_4200_protocol_1_battery_current')
             and has_value('sensor.anenji_4200_protocol_1_battery_power') }}
        state: >-
          {{ is_state('binary_sensor.anenji_4200_protocol_1_battery_connected', 'on')
             and not is_state('binary_sensor.anenji_4200_protocol_1_battery_protection_active', 'on')
             and as_timestamp(now()) - as_timestamp(states.sensor.anenji_4200_protocol_1_battery_power.last_reported, 0) < 120
             and as_timestamp(now()) - as_timestamp(states.sensor.anenji_4200_protocol_1_battery_current.last_reported, 0) < 120
             and as_timestamp(now()) - as_timestamp(states.sensor.anenji_4200_protocol_1_battery_voltage.last_reported, 0) < 120
             and states('sensor.anenji_4200_protocol_1_battery_voltage') | float(99)
                 <= states('sensor.anenji_4200_protocol_1_battery_bulk_voltage') | float(0) + 0.3
             and (is_state('binary_sensor.energetika_battery_absorption_seen', 'on')
               or (is_state('sensor.energetika_battery_charge_cycle', 'absorption')
                   and states('sensor.anenji_4200_protocol_1_battery_voltage') | float(0)
                     >= states('sensor.anenji_4200_protocol_1_battery_float_voltage') | float(99) - 0.1))
             and states('sensor.anenji_4200_protocol_1_battery_current') | float(99) | abs <= 2
             and states('sensor.anenji_4200_protocol_1_battery_power') | float(999) | abs <= 60 }}
        delay_on:
          minutes: 5
        delay_off:
          seconds: 30

  # Remember absorption only within the current uninterrupted charging cycle.
  # A small current at float voltage alone is never evidence of a full battery.
  - triggers:
      - trigger: state
        entity_id: binary_sensor.energetika_battery_absorption_seen
        to: "on"
        id: absorption
      - trigger: time_pattern
        seconds: "/10"
        id: tick
      - trigger: homeassistant
        event: start
        id: startup
    sensor:
      - name: Energetika Battery Charge Cycle
        unique_id: energetika_battery_charge_cycle
        default_entity_id: sensor.energetika_battery_charge_cycle
        state: >-
          {% set t = as_timestamp(now()) %}
          {% set valid = has_value('sensor.anenji_4200_protocol_1_battery_power')
             and has_value('sensor.anenji_4200_protocol_1_battery_voltage')
             and t - as_timestamp(states.sensor.anenji_4200_protocol_1_battery_power.last_reported, 0) < 120
             and t - as_timestamp(states.sensor.anenji_4200_protocol_1_battery_voltage.last_reported, 0) < 120
             and is_state('binary_sensor.anenji_4200_protocol_1_battery_connected', 'on') %}
          {% set recent = t - (this.attributes.get('absorption_at', 0) | float(0)) < 7200 %}
          {% set settings_match = this.attributes.get('bulk_voltage') | float(0) == states('sensor.anenji_4200_protocol_1_battery_bulk_voltage') | float(-1)
              and this.attributes.get('float_voltage') | float(0) == states('sensor.anenji_4200_protocol_1_battery_float_voltage') | float(-1) %}
          {% if is_state('binary_sensor.anenji_4200_protocol_1_battery_connected', 'off')
              or is_state('binary_sensor.energetika_battery_discharge_sustained', 'on') %}idle
          {% elif not valid %}
            {{ 'absorption' if this.state == 'absorption' and recent
                and t - (this.attributes.get('last_valid_at', 0) | float(0)) < 120 else 'idle' }}
          {% elif trigger.id == 'absorption' %}absorption
          {% elif this.state == 'absorption' and recent and settings_match
              and t - (this.attributes.get('last_valid_at', 0) | float(0)) < 120
              and states('sensor.anenji_4200_protocol_1_battery_voltage') | float(0)
                  >= states('sensor.anenji_4200_protocol_1_battery_float_voltage') | float(99) - 0.3 %}absorption
          {% else %}idle{% endif %}
        attributes:
          absorption_at: "{{ as_timestamp(now()) if trigger.id == 'absorption' else this.attributes.get('absorption_at', 0) }}"
          bulk_voltage: "{{ states('sensor.anenji_4200_protocol_1_battery_bulk_voltage') if trigger.id == 'absorption' else this.attributes.get('bulk_voltage', '') }}"
          float_voltage: "{{ states('sensor.anenji_4200_protocol_1_battery_float_voltage') if trigger.id == 'absorption' else this.attributes.get('float_voltage', '') }}"
          last_valid_at: >-
            {{ as_timestamp(now()) if has_value('sensor.anenji_4200_protocol_1_battery_power')
                and has_value('sensor.anenji_4200_protocol_1_battery_voltage')
                and as_timestamp(now()) - as_timestamp(states.sensor.anenji_4200_protocol_1_battery_power.last_reported, 0) < 120
                and as_timestamp(now()) - as_timestamp(states.sensor.anenji_4200_protocol_1_battery_voltage.last_reported, 0) < 120
                and is_state('binary_sensor.anenji_4200_protocol_1_battery_connected', 'on')
                else this.attributes.get('last_valid_at', 0) }}
          tail_power_limit_w: 60

  - triggers:
      - trigger: state
        entity_id: sensor.anenji_4200_protocol_1_battery_power
        id: power
      - trigger: time_pattern
        seconds: "/10"
        id: tick
      - trigger: homeassistant
        event: start
        id: startup
      - trigger: state
        entity_id: input_button.energetika_battery_full
        id: manual_full
      - trigger: state
        entity_id: binary_sensor.energetika_battery_full_qualified
        to: "on"
        id: auto_full
    sensor:
      - name: Energetika Battery Remaining
        unique_id: energetika_battery_remaining
        default_entity_id: sensor.energetika_battery_remaining
        device_class: energy_storage
        state_class: measurement
        unit_of_measurement: Wh
        icon: mdi:battery-high
        state: >-
          {% set full = trigger.id == 'auto_full' or
             (trigger.id == 'manual_full' and trigger.from_state is not none
              and trigger.to_state is not none
              and trigger.to_state.state not in ['unknown', 'unavailable']
                and trigger.from_state.state != trigger.to_state.state
                and (as_timestamp(now()) - as_timestamp(trigger.to_state.state, 0)) | abs < 10) %}
          {% set previous = this.state | float(none) %}
          {% set t = as_timestamp(now()) %}
          {% set dt = t - (this.attributes.get('sample_timestamp', t) | float(t)) %}
          {% set src = states.sensor.anenji_4200_protocol_1_battery_power %}
          {% set valid = has_value('sensor.anenji_4200_protocol_1_battery_power')
              and states('sensor.anenji_4200_protocol_1_battery_power') | float(99999) | abs <= 8400
              and t - as_timestamp(src.last_reported, 0) < 120
              and is_state('binary_sensor.anenji_4200_protocol_1_battery_connected', 'on') %}
          {% if full %}
            2560
          {% elif previous is none %}
            {{ none }}
          {% elif trigger.id == 'startup' or not valid
              or not this.attributes.get('sample_valid', false) or dt < 0 or dt > 120 %}
            {{ previous }}
          {% else %}
            {% set delta = (this.attributes.get('sample_power_w', 0) | float(0)) * dt / 3600 %}
            {{ [[previous + delta, 0] | max, 2560] | min | round(4) }}
          {% endif %}
        attributes:
          capacity_wh: 2560
          nominal_voltage: 25.6
          capacity_ah: 100
          sample_timestamp: "{{ as_timestamp(now()) }}"
          sample_power_w: "{{ states('sensor.anenji_4200_protocol_1_battery_power') | float(0) }}"
          sample_valid: >-
            {{ has_value('sensor.anenji_4200_protocol_1_battery_power')
              and states('sensor.anenji_4200_protocol_1_battery_power') | float(99999) | abs <= 8400
               and as_timestamp(now()) - as_timestamp(states.sensor.anenji_4200_protocol_1_battery_power.last_reported, 0) < 120
               and is_state('binary_sensor.anenji_4200_protocol_1_battery_connected', 'on') }}
          last_full: >-
            {% if trigger.id == 'auto_full' or
               (trigger.id == 'manual_full' and trigger.from_state is not none
                and trigger.to_state is not none
                and trigger.to_state.state not in ['unknown', 'unavailable']
                and trigger.from_state.state != trigger.to_state.state
                and (as_timestamp(now()) - as_timestamp(trigger.to_state.state, 0)) | abs < 10) %}
              {{ now().isoformat() }}
            {% else %}
              {{ this.attributes.get('last_full', '') }}
            {% endif %}
          calibration_source: >-
            {% if trigger.id == 'auto_full' %}charge_completion
            {% elif trigger.id == 'manual_full' and trigger.from_state is not none
                and trigger.to_state is not none
                and trigger.to_state.state not in ['unknown', 'unavailable']
                and trigger.from_state.state != trigger.to_state.state
                and (as_timestamp(now()) - as_timestamp(trigger.to_state.state, 0)) | abs < 10 %}manual
            {% else %}{{ this.attributes.get('calibration_source', 'not_calibrated') }}{% endif %}
          data_gap: >-
            {% set full = trigger.id == 'auto_full' or
               (trigger.id == 'manual_full' and trigger.from_state is not none
                and trigger.to_state is not none
                and trigger.to_state.state not in ['unknown', 'unavailable']
                and trigger.from_state.state != trigger.to_state.state
                and (as_timestamp(now()) - as_timestamp(trigger.to_state.state, 0)) | abs < 10) %}
            {% set t = as_timestamp(now()) %}
            {% set dt = t - (this.attributes.get('sample_timestamp', t) | float(t)) %}
            {% if full %}{{ false }}
            {% else %}
              {{ this.attributes.get('data_gap', false)
                 or trigger.id == 'startup' or dt > 120
                 or not has_value('sensor.anenji_4200_protocol_1_battery_power')
                 or states('sensor.anenji_4200_protocol_1_battery_power') | float(99999) | abs > 8400
                 or t - as_timestamp(states.sensor.anenji_4200_protocol_1_battery_power.last_reported, 0) >= 120
                 or not is_state('binary_sensor.anenji_4200_protocol_1_battery_connected', 'on') }}
            {% endif %}

  - sensor:
      - name: Energetika Battery Calibration Status
        unique_id: energetika_battery_calibration_status
        default_entity_id: sensor.energetika_battery_calibration_status
        icon: mdi:battery-sync
        state: >-
          {% if is_state('binary_sensor.energetika_battery_full_qualified', 'on') %}Полный заряд распознан
          {% elif not has_value('sensor.anenji_4200_protocol_1_battery_power')
              or not has_value('sensor.anenji_4200_protocol_1_battery_voltage')
              or not has_value('sensor.anenji_4200_protocol_1_battery_current')
              or as_timestamp(now()) - as_timestamp(states.sensor.anenji_4200_protocol_1_battery_power.last_reported, 0) >= 120 %}Ожидает свежих показаний АКБ
          {% elif not is_state('binary_sensor.anenji_4200_protocol_1_battery_connected', 'on') %}АКБ не подключена
          {% elif is_state('sensor.energetika_battery_charge_cycle', 'absorption')
              or is_state('binary_sensor.energetika_battery_absorption_seen', 'on') %}
            {% if states('sensor.anenji_4200_protocol_1_battery_power') | float(999) | abs > 60
                or states('sensor.anenji_4200_protocol_1_battery_current') | float(99) | abs > 2 %}Верхнее напряжение достигнуто; ожидает малого тока
            {% else %}Малый ток после верхнего напряжения; подтверждение 5 минут{% endif %}
          {% else %}Ожидает верхнего напряжения ≥ {{ (states('sensor.anenji_4200_protocol_1_battery_bulk_voltage') | float(29) - 0.2) | round(1) }} В{% endif %}
      - name: Energetika Battery Percent Voltage
        unique_id: energetika_battery_percent_voltage
        default_entity_id: sensor.energetika_battery_percent_voltage
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        icon: mdi:battery-outline
        availability: >-
          {{ has_value('sensor.anenji_4200_protocol_1_battery_voltage')
             and has_value('sensor.anenji_4200_protocol_1_battery_under_voltage_off_grid')
             and 0 <= states('sensor.anenji_4200_protocol_1_battery_voltage') | float(-1) <= 40
             and 0 < states('sensor.anenji_4200_protocol_1_battery_under_voltage_off_grid') | float(0) < 29 }}
        state: >-
          {% set v = states('sensor.anenji_4200_protocol_1_battery_voltage') | float(0) %}
          {% set low = states('sensor.anenji_4200_protocol_1_battery_under_voltage_off_grid') | float(0) %}
          {{ [[(v - low) / (29 - low) * 100, 0] | max, 100] | min | round(1) if low < 29 else none }}
        attributes:
          method: Linear voltage estimate; load dependent; independent of energy accounting
          upper_voltage: 29
          lower_voltage: "{{ states('sensor.anenji_4200_protocol_1_battery_under_voltage_off_grid') | float(none) }}"
      - name: Energetika Battery Percent Energy
        unique_id: energetika_battery_percent_energy
        default_entity_id: sensor.energetika_battery_percent_energy
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:battery
        availability: "{{ has_value('sensor.energetika_battery_remaining') }}"
        state: "{{ (states('sensor.energetika_battery_remaining') | float(0) / 2560 * 100) | round(1) }}"
      - name: Energetika Battery Used
        unique_id: energetika_battery_used
        default_entity_id: sensor.energetika_battery_used
        unit_of_measurement: Wh
        device_class: energy_storage
        state_class: measurement
        icon: mdi:battery-minus
        availability: "{{ has_value('sensor.energetika_battery_remaining') }}"
        state: "{{ (2560 - states('sensor.energetika_battery_remaining') | float(0)) | round(2) }}"
      - name: Energetika Battery Remaining Inverter
        unique_id: energetika_battery_remaining_inverter
        default_entity_id: sensor.energetika_battery_remaining_inverter
        unit_of_measurement: Wh
        device_class: energy_storage
        state_class: measurement
        icon: mdi:battery-sync
        availability: "{{ has_value('sensor.anenji_4200_protocol_1_battery_percent') }}"
        state: "{{ (states('sensor.anenji_4200_protocol_1_battery_percent') | float(0) * 25.6) | round(0) }}"

      - name: Energetika Grid Current Estimate
        unique_id: energetika_grid_current_estimate
        default_entity_id: sensor.energetika_grid_current_estimate
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        icon: mdi:current-ac
        availability: >-
          {{ has_value('sensor.anenji_4200_protocol_1_grid_power')
             and has_value('sensor.anenji_4200_protocol_1_grid_voltage')
             and states('sensor.anenji_4200_protocol_1_grid_power') | float(99999) | abs <= 11000
             and 0 <= states('sensor.anenji_4200_protocol_1_grid_voltage') | float(999) <= 300 }}
        state: >-
          {% set v = states('sensor.anenji_4200_protocol_1_grid_voltage') | float(0) %}
          {{ (states('sensor.anenji_4200_protocol_1_grid_power') | float(0) / v) | round(2) if v > 20 else 0 }}
        attributes:
          method: Active current estimate P/U; not RMS current without power factor
      - name: Energetika Battery Runtime To Reserve
        unique_id: energetika_battery_runtime_to_reserve
        default_entity_id: sensor.energetika_battery_runtime_to_reserve
        unit_of_measurement: min
        device_class: duration
        state_class: measurement
        icon: mdi:timer-sand
        availability: >-
          {{ has_value('sensor.energetika_battery_remaining')
             and has_value('sensor.anenji_4200_protocol_1_battery_power')
             and state_attr('sensor.energetika_battery_remaining', 'sample_valid') == true
             and -8400 <= states('sensor.anenji_4200_protocol_1_battery_power') | float(0) < -5 }}
        state: >-
          {% set usable = [states('sensor.energetika_battery_remaining') | float(0) - 512, 0] | max %}
          {% set draw = states('sensor.anenji_4200_protocol_1_battery_power') | float(0) | abs %}
          {{ (usable / draw * 60) | round(1) if draw > 5 else 0 }}
        attributes:
          reserve_percent: 20
          reserve_wh: 512
          assumption: Current net battery discharge power remains constant

  - sensor:
      - name: Energetika Solar Forecast
        unique_id: energetika_solar_forecast
        default_entity_id: sensor.energetika_solar_forecast
        unit_of_measurement: kWh
        icon: mdi:solar-power
        availability: >-
          {{ has_value('sensor.energetika_solar_weather')
             and state_attr('sensor.energetika_solar_weather', 'daily') is mapping }}
        state: >-
          {% set d = state_attr('sensor.energetika_solar_weather', 'daily') or {} %}
          {% set values = d.get('shortwave_radiation_sum', []) %}
          {{ (values[0] | float(0) / 3.6 * 2.52 *
              (1 - states('input_number.energetika_solar_losses') | float(20) / 100)) | round(2) if values else none }}
        attributes:
          capacity_kwp: 2.52
          panels: 4
          panel_watts: 630
          tilt_degrees: 0
          location: Одесса
          source: Open-Meteo
          days: >-
            {% set d = state_attr('sensor.energetika_solar_weather', 'daily') or {} %}
            {% set ns = namespace(days=[]) %}
            {% set factor = 2.52 * (1 - states('input_number.energetika_solar_losses') | float(20) / 100) / 3.6 %}
            {% for t in d.get('time', []) %}
              {% set i = loop.index0 %}
              {% set radiation = d.get('shortwave_radiation_sum', [])[i] | float(none) %}
              {% set ns.days = ns.days + [dict(date=t | timestamp_custom('%Y-%m-%d', true),
                 kwh=(radiation * factor) | round(2) if radiation is not none else none,
                 code=d.get('weather_code', [])[i],
                 min=d.get('temperature_2m_min', [])[i], max=d.get('temperature_2m_max', [])[i])] %}
            {% endfor %}
            {{ ns.days }}
      - name: Energetika Solar Next Hours
        unique_id: energetika_solar_next_hours
        default_entity_id: sensor.energetika_solar_next_hours
        unit_of_measurement: W
        device_class: power
        availability: "{{ is_state('binary_sensor.energetika_weather_fresh', 'on') }}"
        state: >-
          {% set h = state_attr('sensor.energetika_solar_weather', 'hourly') or {} %}
          {% set t = as_timestamp(now()) %}
          {% set ns = namespace(values=[]) %}
          {% for ht in h.get('time', []) %}
            {% if t < ht | float(0) <= t + 7200 %}
              {% set radiation = h.get('shortwave_radiation', [])[loop.index0] | float(none) %}
              {% if radiation is not none %}{% set ns.values = ns.values + [radiation] %}{% endif %}
            {% endif %}
          {% endfor %}
          {{ (ns.values | average * 2.52 * (1 - states('input_number.energetika_solar_losses') | float(20) / 100)) | round(0) if ns.values else none }}
      - name: Energetika Home Baseline
        unique_id: energetika_home_baseline
        default_entity_id: sensor.energetika_home_baseline
        unit_of_measurement: W
        device_class: power
        state: "{{ [[states('sensor.energetika_home_background') | float(550), 400] | max, 700] | min | round(0) }}"
        attributes:
          method: 25th percentile over 30 minutes, limited to 400–700 W
      - name: Energetika Solar Coverage
        unique_id: energetika_solar_coverage
        default_entity_id: sensor.energetika_solar_coverage
        unit_of_measurement: "%"
        availability: "{{ has_value('sensor.energetika_pv_average') }}"
        state: "{{ (states('sensor.energetika_pv_average') | float(0) / states('sensor.energetika_home_baseline') | float(550) * 100) | round(0) }}"
      - name: Energetika Solar Exit Coverage
        unique_id: energetika_solar_exit_coverage
        default_entity_id: sensor.energetika_solar_exit_coverage
        unit_of_measurement: "%"
        availability: "{{ has_value('input_number.energetika_solar_coverage_target') }}"
        state: "{{ states('input_number.energetika_solar_coverage_target') | float(50) - 15 }}"
      - name: Energetika Solar Strategy
        unique_id: energetika_solar_strategy
        default_entity_id: sensor.energetika_solar_strategy
        icon: mdi:weather-partly-cloudy
        state: >-
          {% if is_state('binary_sensor.energetika_morning_sbu_window', 'on') %}
            {% if is_state('binary_sensor.energetika_battery_reserve_critical', 'off')
                and is_state('binary_sensor.energetika_solar_data_fresh', 'on') %}SBU{% else %}SUB{% endif %}
          {% elif is_state('binary_sensor.energetika_solar_critical', 'on')
              or is_state('binary_sensor.energetika_solar_weak', 'on') %}SUB
          {% elif is_state('binary_sensor.energetika_solar_ready', 'on') %}SBU
          {% else %}HOLD{% endif %}
        attributes:
          reason: >-
            {% if is_state('binary_sensor.energetika_morning_sbu_window', 'on') %}
              {% if is_state('binary_sensor.energetika_battery_reserve_critical', 'on') %}Утренний SBU прерван: достигнут резерв АКБ или нижнее напряжение — SUB.
              {% elif not is_state('binary_sensor.energetika_solar_data_fresh', 'on') %}Утренний SBU прерван: нет свежих данных АКБ — SUB.
              {% else %}Разовый утренний SBU до {{ states('input_datetime.energetika_morning_sbu_end')[11:16] }}. Погода и мощность солнца не ограничивают это окно; защита АКБ действует.{% endif %}
            {% elif is_state('sun.sun', 'below_horizon') %}Ночь — питание SUB, АКБ в резерве.
            {% elif is_state('binary_sensor.energetika_solar_critical', 'on') %}Достигнут резерв АКБ или нижний порог напряжения — SUB.
            {% elif not is_state('binary_sensor.energetika_solar_data_fresh', 'on') %}Нет свежей телеметрии. Новый SBU запрещён; через 10 минут — SUB.
            {% elif not is_state('binary_sensor.energetika_weather_fresh', 'on') %}Погода недоступна или устарела. Новый SBU запрещён; через 10 минут — SUB.
            {% elif is_state('binary_sensor.energetika_solar_weak', 'on') %}Пасмурно или солнце слабо покрывает фоновую нагрузку 10 минут — SUB.
            {% elif is_state('binary_sensor.energetika_solar_ready', 'on') %}Подходящая погода и солнечная мощность устойчивы 5 минут — SBU.
            {% else %}Ожидание устойчивых условий. Текущий режим сохраняется.{% endif %}
          enabled: "{{ is_state('input_boolean.energetika_solar_auto', 'on') }}"
          paused: "{{ states('input_datetime.energetika_solar_pause_until') | as_timestamp(0) > as_timestamp(now()) }}"

  - binary_sensor:
      - name: Energetika Weather Fresh
        unique_id: energetika_weather_fresh
        default_entity_id: binary_sensor.energetika_weather_fresh
        state: >-
          {% set c = state_attr('sensor.energetika_solar_weather', 'current') or {} %}
          {{ has_value('sensor.energetika_solar_weather')
             and 0 <= as_timestamp(now()) - c.get('time', 0) | float(0) < 2700
             and c.get('weather_code') is number and c.get('cloud_cover') is number }}
      - name: Energetika Solar Data Fresh
        unique_id: energetika_solar_data_fresh
        default_entity_id: binary_sensor.energetika_solar_data_fresh
        state: >-
          {% set ns = namespace(valid=true) %}
          {% for id in ['sensor.anenji_4200_protocol_1_pv_power', 'sensor.anenji_4200_protocol_1_load_power',
              'sensor.anenji_4200_protocol_1_battery_voltage', 'sensor.anenji_4200_protocol_1_battery_power'] %}
            {% if not has_value(id) or as_timestamp(now()) - as_timestamp(states[id].last_reported, 0) >= 120 %}
              {% set ns.valid = false %}
            {% endif %}
          {% endfor %}
          {{ ns.valid and is_state('binary_sensor.anenji_4200_protocol_1_battery_connected', 'on')
             and has_value('sensor.energetika_pv_average')
             and has_value('sensor.energetika_battery_percent_energy') }}
      - name: Energetika Morning SBU Window
        unique_id: energetika_morning_sbu_window
        default_entity_id: binary_sensor.energetika_morning_sbu_window
        state: >-
          {% set start = state_attr('input_datetime.energetika_morning_sbu_start', 'timestamp') | float(0) %}
          {% set end = state_attr('input_datetime.energetika_morning_sbu_end', 'timestamp') | float(0) %}
          {{ is_state('input_boolean.energetika_morning_sbu_active', 'on')
             and 0 < start <= as_timestamp(now()) < end }}
      - name: Energetika Battery Reserve Critical
        unique_id: energetika_battery_reserve_critical
        default_entity_id: binary_sensor.energetika_battery_reserve_critical
        state: >-
          {{ (has_value('sensor.energetika_battery_percent_energy')
                 and states('sensor.energetika_battery_percent_energy') | float(100) <= 25)
             or (has_value('sensor.anenji_4200_protocol_1_battery_voltage')
                 and has_value('sensor.anenji_4200_protocol_1_battery_under_voltage_off_grid')
                 and states('sensor.anenji_4200_protocol_1_battery_voltage') | float(99)
                    <= states('sensor.anenji_4200_protocol_1_battery_under_voltage_off_grid') | float(0) + 0.2) }}
      - name: Energetika Solar Critical
        unique_id: energetika_solar_critical
        default_entity_id: binary_sensor.energetika_solar_critical
        state: >-
          {{ is_state('binary_sensor.energetika_battery_reserve_critical', 'on')
             or (is_state('sun.sun', 'below_horizon')
                 and not is_state('binary_sensor.energetika_morning_sbu_window', 'on')) }}
      - name: Energetika Solar Ready
        unique_id: energetika_solar_ready
        default_entity_id: binary_sensor.energetika_solar_ready
        state: >-
          {% set c = state_attr('sensor.energetika_solar_weather', 'current') or {} %}
          {% set pv = states('sensor.energetika_pv_average') | float(0) %}
          {% set soc = states('sensor.energetika_battery_percent_energy') | float(0) %}
          {% set base = states('sensor.energetika_home_baseline') | float(550) %}
          {{ is_state('sun.sun', 'above_horizon')
             and is_state('binary_sensor.energetika_solar_data_fresh', 'on')
             and is_state('binary_sensor.energetika_weather_fresh', 'on')
             and not is_state('binary_sensor.energetika_solar_critical', 'on')
             and c.get('weather_code', 99) in [0, 1, 2]
             and c.get('cloud_cover', 100) | float(100) <= 85
             and soc >= states('input_number.energetika_solar_entry_reserve') | float(35)
             and (pv >= states('input_number.energetika_solar_start_watts') | float(600)
               or (pv >= 150 and pv >= base * states('input_number.energetika_solar_coverage_target') | float(50) / 100)
               or (is_state('input_boolean.energetika_solar_early_start', 'on') and pv >= 120
                   and soc >= 50 and c.get('weather_code', 99) in [0, 1]
                   and c.get('cloud_cover', 100) | float(100) <= 30
                   and states('sensor.energetika_solar_next_hours') | float(0) >= base)) }}
        delay_on:
          minutes: 5
      - name: Energetika Solar Weak
        unique_id: energetika_solar_weak
        default_entity_id: binary_sensor.energetika_solar_weak
        state: >-
          {% set c = state_attr('sensor.energetika_solar_weather', 'current') or {} %}
          {% set exit_coverage = states('input_number.energetika_solar_coverage_target') | float(50) - 15 %}
          {% set exit_watts = [200, states('sensor.energetika_home_baseline') | float(550) * exit_coverage / 100] | min %}
          {{ not is_state('binary_sensor.energetika_solar_data_fresh', 'on')
             or not is_state('binary_sensor.energetika_weather_fresh', 'on')
             or c.get('weather_code', 99) not in [0, 1, 2]
             or c.get('cloud_cover', 100) | float(100) >= 90
             or (not is_state('binary_sensor.energetika_solar_ready', 'on')
                 and (states('sensor.energetika_pv_average') | float(0) < exit_watts
                   or states('sensor.energetika_solar_coverage') | float(0) < exit_coverage)) }}
        delay_on:
          minutes: 10

# Public Odesa city centre, not the private coordinates of the installation.
rest:
  - resource: "https://api.open-meteo.com/v1/forecast?latitude=46.4825&longitude=30.7233&current=temperature_2m,relative_humidity_2m,cloud_cover,weather_code,is_day,wind_speed_10m&hourly=shortwave_radiation,temperature_2m,cloud_cover,weather_code,is_day&daily=shortwave_radiation_sum,weather_code,temperature_2m_min,temperature_2m_max&timezone=Europe%2FKyiv&timeformat=unixtime&forecast_days=7"
    scan_interval: 300
    timeout: 20
    sensor:
      - name: Energetika Solar Weather
        unique_id: energetika_solar_weather
        value_template: "{{ value_json.current.time if value_json.current is defined else 'unavailable' }}"
        json_attributes:
          - current
          - daily
          - hourly
        icon: mdi:weather-partly-cloudy

recorder:
  exclude:
    entities:
      - sensor.energetika_solar_weather
      - sensor.energetika_solar_forecast

sensor:
  - platform: statistics
    name: Energetika PV Average
    unique_id: energetika_pv_average
    entity_id: sensor.anenji_4200_protocol_1_pv_power
    state_characteristic: average_step
    max_age:
      minutes: 5
    sampling_size: 600
    keep_last_sample: true
    precision: 0
  - platform: statistics
    name: Energetika Home Background
    unique_id: energetika_home_background
    entity_id: sensor.anenji_4200_protocol_1_load_power
    state_characteristic: percentile
    percentile: 25
    max_age:
      minutes: 30
    sampling_size: 3000
    keep_last_sample: true
    precision: 0

input_boolean:
  energetika_morning_sbu_armed:
    name: "Энергетика · Утренний SBU запланирован"
    icon: mdi:calendar-clock
  energetika_morning_sbu_active:
    name: "Энергетика · Утренний SBU выполняется"
    icon: mdi:weather-sunset-up
  energetika_notify_grid:
    name: "Энергетика · Уведомления о сети"
    icon: mdi:transmission-tower
  energetika_notify_modes:
    name: "Энергетика · Уведомления о SBU/SUB"
    icon: mdi:cellphone-message
  # No initial: false: a new installation is off; HA restores the owner's choice.
  energetika_solar_auto:
    name: "Энергетика · Автоматический SBU/SUB"
    icon: mdi:solar-power-variant
  energetika_solar_early_start:
    name: "Энергетика · Ранний SBU в ясную погоду"
    icon: mdi:weather-sunset-up
  energetika_solar_fault:
    name: "Энергетика · Ошибка переключения"
    icon: mdi:alert-circle-outline
  energetika_solar_configured:
    name: "Энергетика · Начальные настройки созданы"
    icon: mdi:check

input_number:
  energetika_solar_start_watts:
    name: "Энергетика · Порог солнечной мощности"
    min: 300
    max: 1500
    step: 50
    unit_of_measurement: W
    mode: box
  energetika_solar_coverage_target:
    name: "Энергетика · Покрытие фоновой нагрузки"
    min: 50
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: box
  energetika_solar_entry_reserve:
    name: "Энергетика · Минимальный заряд для SBU"
    min: 30
    max: 80
    step: 5
    unit_of_measurement: "%"
    mode: box
  energetika_solar_losses:
    name: "Энергетика · Потери солнечной установки"
    min: 5
    max: 50
    step: 1
    unit_of_measurement: "%"
    mode: box

input_datetime:
  energetika_morning_sbu_start:
    name: "Энергетика · Начало утреннего SBU"
    has_date: true
    has_time: true
  energetika_morning_sbu_end:
    name: "Энергетика · Возврат к погодной автоматике"
    has_date: true
    has_time: true
  energetika_solar_pause_until:
    name: "Энергетика · Пауза автоматики до"
    has_date: true
    has_time: true
  energetika_solar_last_switch:
    name: "Энергетика · Последняя попытка смены режима"
    has_date: true
    has_time: true

input_text:
  energetika_morning_sbu_result:
    name: "Энергетика · Результат утреннего SBU"
    max: 255
  energetika_notification_target:
    name: "Энергетика · Телефон для уведомлений"
    max: 128
  energetika_solar_result:
    name: "Энергетика · Результат переключения"
    max: 255

input_select:
  # No initial: restore the last confirmed state; first observation is silent.
  energetika_grid_last_confirmed:
    name: "Энергетика · Подтверждённое состояние сети"
    options: [unknown, present, absent]
    icon: mdi:transmission-tower

script:
  energetika_morning_sbu_plan:
    alias: "Энергетика · Запланировать SBU на завтра"
    mode: single
    fields:
      start_time:
        required: true
        selector:
          time:
      end_time:
        required: true
        selector:
          time:
    sequence:
      - if: >-
          {{ start_time is not string or end_time is not string
             or not (start_time | regex_match('^([01][0-9]|2[0-3]):[0-5][0-9](:00)?$'))
             or not (end_time | regex_match('^([01][0-9]|2[0-3]):[0-5][0-9](:00)?$'))
             or not (start_time[:5] < end_time[:5] <= '12:00') }}
        then:
          - stop: "Выберите время начала раньше окончания. Утреннее окно заканчивается не позднее 12:00."
            error: true
      - if: "{{ is_state('input_boolean.energetika_morning_sbu_active', 'on') }}"
        then:
          - stop: "Сначала завершите текущее утреннее окно."
            error: true
      - if: "{{ is_state('input_boolean.energetika_solar_fault', 'on') }}"
        then:
          - stop: "Сначала проверьте инвертор и снимите ошибку переключения кнопкой возобновления."
            error: true
      - variables:
          planned_start: "{{ as_timestamp(today_at(start_time[:5]) + timedelta(days=1)) }}"
          planned_end: "{{ as_timestamp(today_at(end_time[:5]) + timedelta(days=1)) }}"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.energetika_morning_sbu_armed
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.energetika_morning_sbu_start
        data:
          timestamp: "{{ planned_start }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.energetika_morning_sbu_end
        data:
          timestamp: "{{ planned_end }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.energetika_morning_sbu_result
        data:
          value: "Завтра {{ (planned_start | float | timestamp_custom('%d.%m %H:%M', true)) }} — SBU до {{ end_time[:5] }}."
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.energetika_morning_sbu_armed
  energetika_morning_sbu_cancel:
    alias: "Энергетика · Отменить утренний SBU"
    mode: single
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.energetika_morning_sbu_armed
            - input_boolean.energetika_morning_sbu_active
      - action: input_text.set_value
        target:
          entity_id: input_text.energetika_morning_sbu_result
        data:
          value: "Утренний запуск отменён. При включённом авто дальше действует погодная логика."
  energetika_phone_notify:
    alias: "Энергетика · Уведомление на выбранный телефон"
    mode: queued
    max: 20
    fields:
      title:
        required: true
        selector:
          text:
      message:
        required: true
        selector:
          text:
    sequence:
      - variables:
          phone: "{{ states('input_text.energetika_notification_target') }}"
      - condition: template
        value_template: "{{ phone.startswith('notify.') and phone in integration_entities('mobile_app') }}"
      - action: notify.send_message
        target:
          entity_id: "{{ phone }}"
        data:
          title: "{{ title }}"
          message: "{{ message }}"
  energetika_alarm_journal:
    alias: "Энергетика · Запись журнала ошибок"
    description: "Отметить, скрыть или восстановить запись. Команд инвертору не отправляет."
    mode: queued
    max: 20
    fields:
      operation:
        required: true
        selector:
          select:
            options: [ack, hide, restore]
      entry_id:
        required: true
        selector:
          text:
    sequence:
      - condition: template
        value_template: >-
          {{ operation in ['ack', 'hide', 'restore']
             and entry_id in ((state_attr('sensor.energetika_inverter_alerts', 'entries') or []) | map(attribute='id') | list) }}
      - event: energetika_alarm_journal
        event_data:
          operation: "{{ operation }}"
          entry_id: "{{ entry_id }}"
  energetika_solar_pause:
    alias: "Энергетика · Пауза автоматики на час"
    mode: restart
    sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.energetika_solar_pause_until
        data:
          timestamp: "{{ as_timestamp(now()) + 3600 }}"
      - if: >-
          {{ is_state('input_boolean.energetika_morning_sbu_armed', 'on')
             or is_state('input_boolean.energetika_morning_sbu_active', 'on') }}
        then:
          - action: script.energetika_morning_sbu_cancel
  energetika_solar_resume:
    alias: "Энергетика · Возобновить автоматику"
    mode: single
    sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.energetika_solar_pause_until
        data:
          timestamp: "{{ as_timestamp(now()) - 1 }}"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.energetika_solar_fault
      - action: input_text.set_value
        target:
          entity_id: input_text.energetika_solar_result
        data:
          value: "Ожидание устойчивых условий."
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.energetika_solar_auto

automation:
  - id: energetika_weather_recovery
    alias: "Энергетика · Восстановить погоду после потери интернета"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        minutes: "/1"
    conditions:
      - condition: template
        value_template: >-
          {% set c = state_attr('sensor.energetika_solar_weather', 'current') or {} %}
          {{ not has_value('sensor.energetika_solar_weather')
             or as_timestamp(now()) - c.get('time', 0) | float(0) > 1200 }}
    actions:
      - action: homeassistant.update_entity
        continue_on_error: true
        target:
          entity_id: sensor.energetika_solar_weather
  - id: energetika_grid_notifications
    alias: "Энергетика · Сеть пропала или восстановилась"
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.energetika_grid_present
        to: ["on", "off"]
        for: "00:00:10"
      - trigger: time_pattern
        seconds: "/15"
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: >-
          {{ states('binary_sensor.energetika_grid_present') in ['on', 'off']
             and as_timestamp(now()) - as_timestamp(states.binary_sensor.energetika_grid_present.last_changed, 0) >= 10
             and has_value('sensor.anenji_4200_protocol_1_grid_voltage')
             and as_timestamp(now()) - as_timestamp(states.sensor.anenji_4200_protocol_1_grid_voltage.last_reported, 0) < 120 }}
    actions:
      - variables:
          previous: "{{ states('input_select.energetika_grid_last_confirmed') }}"
          current: "{{ 'present' if is_state('binary_sensor.energetika_grid_present', 'on') else 'absent' }}"
      - condition: template
        value_template: "{{ previous != current }}"
      # Update before notifying: a failed push never causes a notification loop.
      - action: input_select.select_option
        target:
          entity_id: input_select.energetika_grid_last_confirmed
        data:
          option: "{{ current }}"
      - condition: template
        value_template: "{{ previous in ['present', 'absent'] and is_state('input_boolean.energetika_notify_grid', 'on') }}"
      - action: script.energetika_phone_notify
        continue_on_error: true
        data:
          title: "{{ 'Энергетика · Свет появился' if current == 'present' else 'Энергетика · Свет пропал' }}"
          message: >-
            {{ now().strftime('%d.%m %H:%M') }} ·
            {{ 'Сеть восстановлена' if current == 'present' else 'На входе инвертора пропала сеть' }}.
            Напряжение: {{ states('sensor.anenji_4200_protocol_1_grid_voltage') | float(0) | round(1) }} В.
            АКБ: {{ states('sensor.energetika_battery_percent_energy') }}%.
  - id: energetika_solar_defaults_once
    alias: "Энергетика · Первичная настройка автоматики"
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.energetika_solar_configured
        state: "off"
    actions:
      - action: input_number.set_value
        target:
          entity_id: input_number.energetika_solar_start_watts
        data:
          value: 600
      - action: input_number.set_value
        target:
          entity_id: input_number.energetika_solar_coverage_target
        data:
          value: 50
      - action: input_number.set_value
        target:
          entity_id: input_number.energetika_solar_entry_reserve
        data:
          value: 35
      - action: input_number.set_value
        target:
          entity_id: input_number.energetika_solar_losses
        data:
          value: 20
      - action: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.energetika_solar_early_start
            - input_boolean.energetika_solar_configured
  - id: energetika_morning_sbu_manager
    alias: "Энергетика · Разовый утренний SBU"
    description: "Сохраняемый запуск на завтра; команды инвертору выполняет общий контроллер SBU/SUB."
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time
        at: input_datetime.energetika_morning_sbu_start
        id: start
      - trigger: time
        at: input_datetime.energetika_morning_sbu_end
        id: end
      - trigger: time_pattern
        seconds: "/30"
        id: tick
      - trigger: homeassistant
        event: start
        id: boot
      - trigger: state
        entity_id: input_boolean.energetika_solar_auto
        from: "on"
        to: "off"
        id: owner_stop
      - trigger: state
        entity_id:
          - binary_sensor.energetika_battery_reserve_critical
          - binary_sensor.energetika_solar_data_fresh
          - input_boolean.energetika_solar_fault
        id: protection
    actions:
      - variables:
          epoch: "{{ as_timestamp(now()) }}"
          start_at: "{{ state_attr('input_datetime.energetika_morning_sbu_start', 'timestamp') | float(0) }}"
          end_at: "{{ state_attr('input_datetime.energetika_morning_sbu_end', 'timestamp') | float(0) }}"
          controller_ids: >-
            {{ states.automation | selectattr('attributes.id', 'defined')
               | selectattr('attributes.id', 'eq', 'energetika_solar_mode_control')
               | map(attribute='entity_id') | list }}
      - choose:
          - conditions: >-
              {{ trigger is defined and trigger.id == 'owner_stop'
                 and (is_state('input_boolean.energetika_morning_sbu_active', 'on')
                      or is_state('input_boolean.energetika_morning_sbu_armed', 'on')) }}
            sequence:
              - action: script.energetika_morning_sbu_cancel
          - conditions: "{{ is_state('input_boolean.energetika_morning_sbu_active', 'on') }}"
            sequence:
              - variables:
                  finish_reason: >-
                    {% if not (0 < start_at | float <= epoch | float < end_at | float) %}Утреннее окно завершено; далее действует обычная погодная автоматика.
                    {% elif not is_state('input_boolean.energetika_solar_auto', 'on') %}Автоматика выключена. Утреннее окно завершено; текущий режим сохраняется.
                    {% elif is_state('binary_sensor.energetika_battery_reserve_critical', 'on') %}Утренний SBU завершён: достигнут резерв 25% или нижний порог напряжения АКБ.
                    {% elif is_state('input_boolean.energetika_solar_fault', 'on') %}Утренний SBU остановлен: смена режима не подтверждена. Проверьте инвертор.
                    {% elif not is_state('binary_sensor.energetika_solar_data_fresh', 'on') and is_state('select.anenji_4200_protocol_1_output_source_priority', 'Solar-Utility-Battery (SUB)') %}Утренний SBU завершён: нет свежих данных АКБ, подтверждён SUB.
                    {% endif %}
              - if: "{{ finish_reason | trim != '' }}"
                then:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.energetika_morning_sbu_active
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.energetika_morning_sbu_result
                    data:
                      value: "{{ finish_reason | trim }}"
          - conditions: >-
              {{ is_state('input_boolean.energetika_morning_sbu_armed', 'on')
                 and (epoch | float >= start_at | float or end_at | float <= start_at | float) }}
            sequence:
              - variables:
                  wait_for_data: >-
                    {{ 0 < start_at | float <= epoch | float < end_at | float
                       and epoch | float - start_at | float <= 900
                       and not is_state('input_boolean.energetika_solar_fault', 'on')
                       and states('input_datetime.energetika_solar_pause_until') | as_timestamp(0) <= epoch | float
                       and (not is_state('binary_sensor.energetika_solar_data_fresh', 'on')
                            or not has_value('sensor.anenji_4200_protocol_1_battery_under_voltage_off_grid')
                            or not has_value('select.anenji_4200_protocol_1_output_source_priority')
                            or not has_value('sensor.anenji_4200_protocol_1_control_mode')) }}
                  skip_reason: >-
                    {% set e = 'select.anenji_4200_protocol_1_output_source_priority' %}
                    {% if not (0 < start_at | float < end_at | float) %}Некорректная дата запуска. Выберите время заново.
                    {% elif epoch | float >= end_at | float or epoch | float - start_at | float > 900 %}Время запуска пропущено более чем на 15 минут. Позднее переключение отменено.
                    {% elif is_state('input_boolean.energetika_solar_fault', 'on') %}Есть неподтверждённая смена режима. Сначала проверьте инвертор.
                    {% elif states('input_datetime.energetika_solar_pause_until') | as_timestamp(0) > epoch | float %}Действует ручная пауза.
                    {% elif not is_state('binary_sensor.energetika_solar_data_fresh', 'on') or not has_value('sensor.anenji_4200_protocol_1_battery_under_voltage_off_grid') or not is_state('binary_sensor.energetika_battery_reserve_critical', 'off') %}Нет свежих безопасных данных АКБ либо достигнут нижний предел.
                    {% elif states('sensor.energetika_battery_percent_energy') | float(0) < states('input_number.energetika_solar_entry_reserve') | float(35) %}Заряд АКБ ниже настроенного порога входа {{ states('input_number.energetika_solar_entry_reserve') }}%.
                    {% elif not has_value(e) or states('sensor.anenji_4200_protocol_1_control_mode') != 'full' or state_attr(e, 'editable') == false or state_attr(e, 'policy_editable') == false or state_attr(e, 'blocked_by_inverter') %}Нет связи или разрешения на смену режима инвертора.
                    {% elif 'Solar-Battery-Utility (SBU)' not in (state_attr(e, 'options') or []) %}SBU недоступен в текущем списке режимов.
                    {% elif controller_ids | count == 0 %}Не найден общий контроллер SBU/SUB.
                    {% endif %}
              - if: "{{ wait_for_data }}"
                then:
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.energetika_morning_sbu_result
                    data:
                      value: "Время запуска наступило. Ожидаются данные инвертора; запуск возможен не позднее {{ (start_at | float + 900) | timestamp_custom('%H:%M', true) }}."
                else:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.energetika_morning_sbu_armed
                  - if: "{{ skip_reason | trim != '' }}"
                    then:
                      - action: input_text.set_value
                        target:
                          entity_id: input_text.energetika_morning_sbu_result
                        data:
                          value: "Запуск пропущен: {{ skip_reason | trim }}"
                      - if: "{{ is_state('input_boolean.energetika_notify_modes', 'on') }}"
                        then:
                          - action: script.energetika_phone_notify
                            continue_on_error: true
                            data:
                              title: "Энергетика · Утренний SBU не запущен"
                              message: "{{ skip_reason | trim }}"
                    else:
                      - action: input_boolean.turn_on
                        target:
                          entity_id: input_boolean.energetika_morning_sbu_active
                      - action: input_boolean.turn_on
                        target:
                          entity_id: input_boolean.energetika_solar_auto
                      - action: automation.turn_on
                        target:
                          entity_id: "{{ controller_ids }}"
                      - action: input_text.set_value
                        target:
                          entity_id: input_text.energetika_morning_sbu_result
                        data:
                          value: "Утреннее окно открыто до {{ states('input_datetime.energetika_morning_sbu_end')[11:16] }}. Режим и подтверждение — в блоке управления выше."
  - id: energetika_solar_mode_control
    alias: "Энергетика · Погода и солнечный SBU/SUB"
    description: "Единый исполнитель SBU/SUB: утреннее окно, погода и защита резерва АКБ."
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: time_pattern
        seconds: "/30"
      - trigger: state
        entity_id:
          - sensor.energetika_solar_strategy
          - input_boolean.energetika_solar_auto
          - input_boolean.energetika_solar_fault
          - input_datetime.energetika_solar_pause_until
          - input_boolean.energetika_morning_sbu_active
          - binary_sensor.energetika_morning_sbu_window
    conditions:
      - condition: state
        entity_id: input_boolean.energetika_solar_auto
        state: "on"
      - condition: state
        entity_id: input_boolean.energetika_solar_fault
        state: "off"
      - condition: template
        value_template: "{{ states('input_datetime.energetika_solar_pause_until') | as_timestamp(0) <= as_timestamp(now()) }}"
      - condition: template
        value_template: >-
          {% set e = 'select.anenji_4200_protocol_1_output_source_priority' %}
          {{ has_value(e)
             and states('sensor.anenji_4200_protocol_1_control_mode') == 'full'
             and state_attr(e, 'editable') != false
             and state_attr(e, 'policy_editable') != false
             and not state_attr(e, 'blocked_by_inverter')
             and states('sensor.energetika_solar_strategy') in ['SBU', 'SUB'] }}
      - condition: template
        value_template: >-
          {{ is_state('binary_sensor.energetika_solar_critical', 'on')
             or (is_state('binary_sensor.energetika_morning_sbu_window', 'on')
                 and (is_state('sensor.energetika_solar_strategy', 'SUB')
                     or states('input_datetime.energetika_solar_last_switch') | as_timestamp(0)
                        < state_attr('input_datetime.energetika_morning_sbu_start', 'timestamp') | float(0)))
             or as_timestamp(now()) - states('input_datetime.energetika_solar_last_switch') | as_timestamp(0) >= 600 }}
    actions:
      - variables:
          morning_now: >-
            {{ is_state('input_boolean.energetika_morning_sbu_active', 'on')
               and 0 < state_attr('input_datetime.energetika_morning_sbu_start', 'timestamp') | float(0)
                   <= as_timestamp(now()) < state_attr('input_datetime.energetika_morning_sbu_end', 'timestamp') | float(0) }}
          target_code: >-
            {% if morning_now %}
              {{ 'SBU' if is_state('binary_sensor.energetika_battery_reserve_critical', 'off')
                   and is_state('binary_sensor.energetika_solar_data_fresh', 'on') else 'SUB' }}
            {% else %}{{ states('sensor.energetika_solar_strategy') }}{% endif %}
          target_mode: "{{ 'Solar-Battery-Utility (SBU)' if target_code == 'SBU' else 'Solar-Utility-Battery (SUB)' }}"
          previous_mode: "{{ states('select.anenji_4200_protocol_1_output_source_priority').split('(')[-1].replace(')', '') }}"
          decision_reason: >-
            {% if morning_now and target_code == 'SBU' %}Разовый утренний запуск до {{ states('input_datetime.energetika_morning_sbu_end')[11:16] }}; защита АКБ действует.
            {% else %}{{ state_attr('sensor.energetika_solar_strategy', 'reason') }}{% endif %}
      - condition: template
        value_template: >-
          {{ target_mode in (state_attr('select.anenji_4200_protocol_1_output_source_priority', 'options') or [])
             and not is_state('select.anenji_4200_protocol_1_output_source_priority', target_mode) }}
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.energetika_solar_last_switch
        data:
          timestamp: "{{ as_timestamp(now()) }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.energetika_solar_result
        data:
          value: "{{ now().strftime('%d.%m %H:%M') }} · Переключение на {{ target_code }}…"
      - action: select.select_option
        continue_on_error: true
        target:
          entity_id: select.anenji_4200_protocol_1_output_source_priority
        data:
          option: "{{ target_mode }}"
      - wait_template: "{{ is_state('select.anenji_4200_protocol_1_output_source_priority', target_mode) }}"
        timeout: "00:00:20"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ wait.completed }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.energetika_solar_result
            data:
              value: "{{ now().strftime('%d.%m %H:%M') }} · Инвертор подтвердил {{ target_code }}."
          - if: >-
              {{ target_code == 'SUB' and is_state('input_boolean.energetika_morning_sbu_active', 'on') }}
            then:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.energetika_morning_sbu_active
              - action: input_text.set_value
                target:
                  entity_id: input_text.energetika_morning_sbu_result
                data:
                  value: "Утренний SBU завершён защитой: {{ decision_reason }}"
          - if: "{{ is_state('input_boolean.energetika_notify_modes', 'on') }}"
            then:
              - action: script.energetika_phone_notify
                continue_on_error: true
                data:
                  title: "Энергетика · Автоматика включила {{ target_code }}"
                  message: >-
                    {{ now().strftime('%d.%m %H:%M') }} · {{ previous_mode }} → {{ target_code }}.
                    {{ decision_reason }} PV: {{ states('sensor.energetika_pv_average') }} Вт;
                    АКБ: {{ states('sensor.energetika_battery_percent_energy') }}%.
        else:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.energetika_solar_fault
          - action: input_text.set_value
            target:
              entity_id: input_text.energetika_solar_result
            data:
              value: "{{ now().strftime('%d.%m %H:%M') }} · {{ target_code }} не подтверждён. Автоматика остановлена; проверьте режим и нажмите «Возобновить»."
          - if: "{{ is_state('input_boolean.energetika_notify_modes', 'on') }}"
            then:
              - action: script.energetika_phone_notify
                continue_on_error: true
                data:
                  title: "Энергетика · Автоматика остановлена"
                  message: >-
                    {{ now().strftime('%d.%m %H:%M') }} · Переход на {{ target_code }} не подтверждён.
                    Проверьте фактический режим в панели и нажмите «Возобновить».
